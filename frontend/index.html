<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tip Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Tip Calculator</h1>
    <form id="tip-form">
      <label for="bill">What was the total bill in rupees?</label>
      <input id="bill" type="number" step="0.01" min="0" placeholder="₹0.00" required />

      <label for="tip">What percentage tip do you want to leave?</label>
      <input id="tip" type="number" step="0.1" min="0" placeholder="15" required />

      <label for="people">How many people are splitting the bill?</label>
      <input id="people" type="number" min="1" placeholder="1" required />

      <button type="submit">Calculate</button>
    </form>

    <div class="result" id="result">
      <p>Each person should pay:</p>
      <strong id="amount">₹0.00</strong>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
